spring.config.import=
spring.datasource.url=jdbc:h2:mem:auth;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.auth.secret=test-only-secret-which-is-at-least-48-characters-long
app.mail.from=sender@example.test
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
logging.level.root=WARN
