spring.application.name=moc-sach
spring.config.import=optional:file:.local/application.properties,optional:file:.local/mail.properties
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=WebsiteQuanLyCuaHangSachCu;integratedSecurity=true;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.mail.default-encoding=UTF-8
app.mail.from=${GMAIL_USERNAME:}
app.auth.secret=${AUTH_SECRET:}
app.auth.secure-cookie=${SECURE_COOKIE:false}
app.auth.otp-seconds=300
app.auth.resend-seconds=60
app.auth.max-attempts=5
logging.level.org.hibernate.SQL=WARN

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
